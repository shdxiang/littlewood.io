<!-- Three.js r128 自托管（CSP 只允许 self）：首屏背景用黎曼页同一个场景 -->
<script type="importmap">
{"imports":{"three":"./vendor/three-r128/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
// 首屏背景：黎曼页的地形搬过来做背景。高度 ∝ 偏离临界线的距离，零点锁在谷底；自动环绕，鼠标轻微视差。
const canvas = document.getElementById('field');
const hero = canvas.parentElement;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = !window.matchMedia('(pointer: coarse)').matches;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' });
} catch (e) { canvas.remove(); throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.015);
const world = new THREE.Group();
scene.add(world);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
const target = new THREE.Vector3();

scene.add(new THREE.AmbientLight(0x404060));
const dirLight = new THREE.DirectionalLight(0xaaccff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const pointLight = new THREE.PointLight(0x66ffcc, 1.5, 30);
pointLight.position.set(0, 2, 0);
world.add(pointLight);

// 前 20 个非平凡零点的虚部
const zeroHeights = [
  14.134725, 21.022040, 25.010858, 30.424876, 32.935062,
  37.586178, 40.918719, 43.327073, 48.005151, 49.773832,
  52.970321, 56.446248, 59.347044, 60.831779, 65.112544,
  67.079811, 69.546402, 72.067158, 75.704691, 77.144840
];
const T_MIN = -40, T_MAX = 90, T_RANGE = T_MAX - T_MIN, T_CENTER = (T_MIN + T_MAX) / 2;
const SIGMA_MIN = -0.2, SIGMA_MAX = 1.2, SIGMA_RANGE = SIGMA_MAX - SIGMA_MIN;
const SCALE_X = 6, SCALE_Z = 18 / T_RANGE;
const sigmaToX = s => (s - 0.5) * SCALE_X;
const tToZ = t => (t - T_CENTER) * SCALE_Z;

// 临界线
const linePts = [];
for (let i = 0; i <= 200; i++) linePts.push(new THREE.Vector3(sigmaToX(0.5), 0, tToZ(T_MIN + (i / 200) * T_RANGE)));
world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), new THREE.LineBasicMaterial({ color: 0x66ffcc })));
const glowLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(linePts), new THREE.LineBasicMaterial({ color: 0x33ffaa, transparent: true, opacity: 0.3 }));
glowLine.scale.set(1.005, 1, 1);
world.add(glowLine);

// 零点：发光球 + 光晕
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,220,100,1)'); g.addColorStop(0.4, 'rgba(255,180,50,.6)'); g.addColorStop(1, 'rgba(255,150,0,0)');
  const ctx = c.getContext('2d'); ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const sphereGeom = new THREE.SphereGeometry(0.15, 16, 16);
const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffd966, emissive: 0xffaa00, emissiveIntensity: 2, roughness: 0.2, metalness: 0.1 });
const glowMap = glowTexture();
const spheres = [], sprites = [];
zeroHeights.forEach((t, i) => {
  const m = new THREE.Mesh(sphereGeom, sphereMat);
  m.position.set(sigmaToX(0.5), 0, tToZ(t)); m.userData.phase = i * 0.8;
  world.add(m); spheres.push(m);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowMap, color: 0xffd966, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  sp.scale.set(0.8, 0.8, 1); sp.position.copy(m.position);
  world.add(sp); sprites.push(sp);
});

// 粒子地形（概念示例）
const GX = 80, GZ = 150, N = GX * GZ;
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
const low = new THREE.Color(0x33ffaa), high = new THREE.Color(0x6688ff), mix = new THREE.Color();
let idx = 0;
for (let ix = 0; ix < GX; ix++) for (let iz = 0; iz < GZ; iz++) {
  const sigma = SIGMA_MIN + (ix / (GX - 1)) * SIGMA_RANGE, t = T_MIN + (iz / (GZ - 1)) * T_RANGE;
  let h = Math.abs(sigma - 0.5) * 3.5, dMin = Infinity;
  for (const zt of zeroHeights) dMin = Math.min(dMin, Math.abs(t - zt));
  h *= 1 - 0.85 * Math.exp(-dMin * dMin / 1.2);
  h += 0.08 * Math.sin(sigma * 12) * Math.cos(t * 0.5);
  pos[idx * 3] = sigmaToX(sigma); pos[idx * 3 + 1] = h; pos[idx * 3 + 2] = tToZ(t);
  mix.copy(low).lerp(high, Math.min(h / 3, 1));
  col[idx * 3] = mix.r; col[idx * 3 + 1] = mix.g; col[idx * 3 + 2] = mix.b;
  idx++;
}
const terrainGeom = new THREE.BufferGeometry();
terrainGeom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
terrainGeom.setAttribute('color', new THREE.BufferAttribute(col, 3));
world.add(new THREE.Points(terrainGeom, new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })));

// 谷底漂浮粒子
const EXTRA = 600, ePos = new Float32Array(EXTRA * 3), eCol = new Float32Array(EXTRA * 3);
const mint = new THREE.Color(0x66ffcc), gold = new THREE.Color(0xffd966);
for (let i = 0; i < EXTRA; i++) {
  ePos[i * 3] = sigmaToX(0.3 + Math.random() * 0.4); ePos[i * 3 + 1] = Math.random() * 0.3 + 0.1; ePos[i * 3 + 2] = tToZ(T_MIN + Math.random() * T_RANGE);
  mix.copy(mint).lerp(gold, Math.random());
  eCol[i * 3] = mix.r; eCol[i * 3 + 1] = mix.g; eCol[i * 3 + 2] = mix.b;
}
const extraGeom = new THREE.BufferGeometry();
extraGeom.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
extraGeom.setAttribute('color', new THREE.BufferAttribute(eCol, 3));
const extra = new THREE.Points(extraGeom, new THREE.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
world.add(extra);

// 布局：桌面把地形放到右下，手机放到下半屏
let W = 1, H = 1, small = false;
function resize() {
  const r = hero.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); small = W < 700;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  world.position.set(small ? 0.5 : 5, small ? -5.5 : -2.5, 0);
}

// 自动环绕 + 视差
let angle = 0.42, mx = 0, my = 0, px = 0, py = 0, raf = 0, visible = true, last = performance.now();
const clock = new THREE.Clock();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const elapsed = clock.getElapsedTime();
  if (!reduceMotion) {
    angle += dt * 0.0628;
    spheres.forEach(m => { const k = 1 + 0.3 * Math.sin(elapsed * 2.5 + m.userData.phase); m.scale.set(k, k, k); });
