<body>
    <div id="info">
        <a class="home" href="./"><svg viewBox="10 12 82 74" aria-hidden="true"><use href="./mark.svg#mark"/></svg>小木块</a>
        <h1>黎曼猜想 · Riemann Hypothesis</h1>
        <p>ζ函数的所有<span class="highlight">非平凡零点</span>都位于<span class="critical">临界线 Re(s)=1/2</span> 上。</p>
        <p style="font-size:0.82rem; opacity:0.75; margin-top:12px;">
            <span style="color:#ffd966;">●</span> 发光点：已知非平凡零点 (1/2 + i·t)<br>
            <span id="legendAdded" hidden><span style="color:#c08cff;">●</span> 紫点：你加的零点<br></span>
            <span style="color:#66ffcc;">━</span> 亮线：临界线 σ = 0.5<br>
            地形是概念示例，不是真实的 |ζ(s)|：高度 ∝ 偏离临界线的距离，零点被“锁定”在谷底。
        </p>
    </div>
    <div id="status">
        <span id="statusText" aria-live="polite">拖动旋转，轻点暂停 · 前 20 个零点全部落在 <i>临界线</i>&nbsp;上</span><button id="addZero" type="button">＋ 加一个零点</button><button id="cxToggle" type="button" aria-pressed="false">放一个反例</button>
        <div id="cxPanel" hidden>
            <label for="cxSigma">σ</label>
            <input id="cxSigma" type="range" min="0.05" max="0.95" step="0.01" value="0.75" autocomplete="off">
            <p>离开临界线的零点一定四个一组：左右关于临界线对称，上下关于实轴对称。这个高度早已验算过，没有反例；真要有，只能在 t &gt; 3×10¹² 以上。</p>
        </div>
    </div>

    <!-- Three.js r128 自托管（CSP 只允许 self） -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three-r128/build/three.module.js",
                "three/addons/": "./vendor/three-r128/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        // 系统设了“减少动态效果”就不自动旋转、不脉动，零点直接落地
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        controls.autoRotate = !reduceMotion;
        controls.autoRotateSpeed = 0.6;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 6;
        controls.maxDistance = 40;

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xaaccff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x66ffcc, 1.5, 30);
        pointLight.position.set(0, 2, 0);
        scene.add(pointLight);

        // --- 已知非平凡零点的虚部 (前20个) ---
        const zeroHeights = [
            14.134725, 21.022040, 25.010858, 30.424876, 32.935062,
            37.586178, 40.918719, 43.327073, 48.005151, 49.773832,
            52.970321, 56.446248, 59.347044, 60.831779, 65.112544,
            67.079811, 69.546402, 72.067158, 75.704691, 77.144840
        ];
        // 点“加一个零点”时依次落下：先是第 21–25 个（第 26 个 t≈92.5，超出图的范围），
        // 再是下半边前 5 个零点的共轭镜像 1/2 − i·t（ζ(s̄) 是 ζ(s) 的共轭，零点上下对称）
        const moreZeros = [
            79.337375, 82.910381, 84.735493, 87.425275, 88.809111,
            -14.134725, -21.022040, -25.010858, -30.424876, -32.935062
        ];

        // 假想反例：放在 t=35（两个真零点之间），σ 由滑块控制；
        // 必然带出镜像 1−σ，以及下半边 t=−35 的一对共轭，一共 4 个
        const CX_T = 35;
        let cxOn = false, cxS = 0.75;

        // --- 复平面网格 (σ 从 -0.2 到 1.2, t 从 -40 到 90) ---
        // 为了视觉效果，将 t 轴压缩到 -9 到 9 的视觉范围内（通过缩放）
        const T_MIN = -40, T_MAX = 90;
        const T_RANGE = T_MAX - T_MIN;
        const SIGMA_MIN = -0.2, SIGMA_MAX = 1.2;
        const SIGMA_RANGE = SIGMA_MAX - SIGMA_MIN;

        // 将数学坐标映射到场景坐标：x = (σ - 0.5) * SCALE_X, z = (t - T_CENTER) * SCALE_Z
        const SCALE_X = 6;
        const SCALE_Z = 18 / T_RANGE; // t 范围大，压缩到 18 个单位长
        const T_CENTER = (T_MIN + T_MAX) / 2; // 视觉中心对应的 t 值

        function sigmaToX(sigma) {
            return (sigma - 0.5) * SCALE_X;
        }
        function tToZ(t) {
            return (t - T_CENTER) * SCALE_Z;
        }

        // --- 1. 绘制临界线 σ = 0.5 (一条发光的线) ---
        const criticalLinePoints = [];
        for (let i = 0; i <= 200; i++) {
            const t = T_MIN + (i / 200) * T_RANGE;
            criticalLinePoints.push(new THREE.Vector3(sigmaToX(0.5), 0, tToZ(t)));
        }
        const criticalLineGeometry = new THREE.BufferGeometry().setFromPoints(criticalLinePoints);
        const criticalLineMaterial = new THREE.LineBasicMaterial({ color: 0x66ffcc, linewidth: 1 }); // linewidth not supported everywhere
        const criticalLine = new THREE.Line(criticalLineGeometry, criticalLineMaterial);
        scene.add(criticalLine);

        // 额外加一条更亮的细线（使用 TubeGeometry 或 简单的 LineSegments 加发光）
        const glowLineGeom = new THREE.BufferGeometry().setFromPoints(criticalLinePoints);
        const glowLineMat = new THREE.LineBasicMaterial({ color: 0x33ffaa, transparent: true, opacity: 0.3 });
        const glowLine = new THREE.Line(glowLineGeom, glowLineMat);
        glowLine.scale.set(1.005, 1, 1);
        scene.add(glowLine);

        // --- 2. 非平凡零点 (发光球体) ---
        const zeroGroup = new THREE.Group();
        const zeroSpheres = [];

        const sphereGeom = new THREE.SphereGeometry(0.15, 16, 16);
        const sphereMat = new THREE.MeshStandardMaterial({
            color: 0xffd966,
            emissive: 0xffaa00,
            emissiveIntensity: 2.0,
            roughness: 0.2,
            metalness: 0.1
        });
        // 用户自己加的零点用紫色
        const addedMat = new THREE.MeshStandardMaterial({
            color: 0xc08cff,
            emissive: 0x7a3dff,
            emissiveIntensity: 2.0,
            roughness: 0.2,
            metalness: 0.1
        });
        const addedGlow = createGlowTexture('235, 215, 255', '190, 140, 255', '150, 90, 255');

        const zeroGlow = createGlowTexture();

        zeroHeights.forEach((t, index) => addZero(t, index, 0, false));
        scene.add(zeroGroup);

        function addZero(t, index, y, added) {
            const x = sigmaToX(0.5);
            const z = tToZ(t);
            const sphere = new THREE.Mesh(sphereGeom, added ? addedMat : sphereMat);
            sphere.position.set(x, y, z);
            sphere.userData.baseScale = 1.0;
            sphere.userData.phase = index * 0.8;
            zeroGroup.add(sphere);
            zeroSpheres.push(sphere);

            // 添加光晕效果 (使用 Sprite 或 点光源)
            const glowSpriteMat = new THREE.SpriteMaterial({
                map: added ? addedGlow : zeroGlow,
                color: added ? 0xffffff : 0xffd966,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(glowSpriteMat);
            sprite.scale.set(0.8, 0.8, 1);
            sprite.position.copy(sphere.position);
            zeroGroup.add(sprite);
            return { sphere, sprite };
        }

        // 辅助函数：创建圆形渐变纹理用于光晕
        function createGlowTexture(inner = '255, 220, 100', mid = '255, 180, 50', outer = '255, 150, 0') {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, `rgba(${inner}, 1)`);
            gradient.addColorStop(0.4, `rgba(${mid}, 0.6)`);
            gradient.addColorStop(1, `rgba(${outer}, 0)`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. 粒子地形：表现 |ζ(s)| 的概念性高度 ---
        // 高度函数：在临界线附近为 0，偏离越远越高；在零点附近形成凹陷。
        // 这是一个概念性可视化，并非精确的 ζ 函数计算。
        const GRID_SIZE_X = 80;
        const GRID_SIZE_Z = 150;
        const particleCount = GRID_SIZE_X * GRID_SIZE_Z;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // 颜色映射：低处偏绿(0,1,0.8)，高处偏蓝紫(0.2,0.4,1.0)
        const lowColor = new THREE.Color(0x33ffaa);
        const highColor = new THREE.Color(0x6688ff);
        const mixColor = new THREE.Color();

        // 新零点落地后重算一遍，让它的凹陷出现
        function updateTerrain() {
            let idx = 0;
            for (let ix = 0; ix < GRID_SIZE_X; ix++) {
                for (let iz = 0; iz < GRID_SIZE_Z; iz++) {
                    const sigma = SIGMA_MIN + (ix / (GRID_SIZE_X - 1)) * SIGMA_RANGE;
                    const t = T_MIN + (iz / (GRID_SIZE_Z - 1)) * T_RANGE;
                    const x = sigmaToX(sigma);
                    const z = tToZ(t);

                    // 计算概念性高度：
                    // 基础高度与 |σ - 0.5| 成正比 (偏离临界线升高)
                    let height = Math.abs(sigma - 0.5) * 3.5;

                    // 在零点附近增加“凹陷”效果：如果 t 接近某个零点，降低高度
                    let minDistToZero = Infinity;
                    zeroHeights.forEach(zt => {
                        const dist = Math.abs(t - zt);
                        if (dist < minDistToZero) minDistToZero = dist;
                    });
                    // 凹陷宽度约 1.5 个 t 单位
                    const dipFactor = Math.exp(-minDistToZero * minDistToZero / 1.2);
                    height *= (1 - 0.85 * dipFactor); // 零点附近高度降低 85%

                    // 假想反例：在 (σ, t) 和镜像 (1−σ, t) 各挖一个坑
                    if (cxOn) {
                        for (const s of [cxS, 1 - cxS]) {
                            for (const ct of [CX_T, -CX_T]) {
                                const d2 = ((sigma - s) / 0.06) ** 2 + ((t - ct) / 1.1) ** 2;
                                height *= 1 - 0.95 * Math.exp(-d2);
                            }
                        }
                    }

                    // 添加一些细微的波动，让地形更自然
                    height += 0.08 * Math.sin(sigma * 12) * Math.cos(t * 0.5);

                    positions[idx * 3] = x;
                    positions[idx * 3 + 1] = height;
                    positions[idx * 3 + 2] = z;

                    // 颜色：根据高度混合
                    const mixFactor = Math.min(height / 3.0, 1.0);
                    // 复用同一个 Color：拖反例滑块时每次都要重算 12000 个点
                    const color = mixColor.copy(lowColor).lerp(highColor, mixFactor);
                    colors[idx * 3] = color.r;
                    colors[idx * 3 + 1] = color.g;
                    colors[idx * 3 + 2] = color.b;

                    idx++;
                }
            }
        }
        updateTerrain();

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // --- 4. 添加一些“相位”光晕粒子，增加视觉丰富度 ---
        const extraParticlesGeom = new THREE.BufferGeometry();
        const extraCount = 600;
        const extraPos = new Float32Array(extraCount * 3);
        const extraCol = new Float32Array(extraCount * 3);
        for (let i = 0; i < extraCount; i++) {
            const sigma = 0.3 + Math.random() * 0.4; // 集中在临界线附近
            const t = T_MIN + Math.random() * T_RANGE;
            const x = sigmaToX(sigma);
            const z = tToZ(t);
            // 高度略微随机，漂浮在谷底附近
            const y = Math.random() * 0.3 + 0.1;

            extraPos[i * 3] = x;
            extraPos[i * 3 + 1] = y;
            extraPos[i * 3 + 2] = z;

            const c = new THREE.Color(0x66ffcc).lerp(new THREE.Color(0xffd966), Math.random());
            extraCol[i * 3] = c.r;
            extraCol[i * 3 + 1] = c.g;
            extraCol[i * 3 + 2] = c.b;
        }
        extraParticlesGeom.setAttribute('position', new THREE.BufferAttribute(extraPos, 3));
        extraParticlesGeom.setAttribute('color', new THREE.BufferAttribute(extraCol, 3));
        const extraParticlesMat = new THREE.PointsMaterial({
            size: 0.06,
            vertexColors: true,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const extraParticles = new THREE.Points(extraParticlesGeom, extraParticlesMat);
        scene.add(extraParticles);

        // --- 动画 ---
        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // 零点球体和光晕精灵脉动
            if (!reduceMotion) {
                zeroSpheres.forEach(sphere => {
                    const scale = 1.0 + 0.3 * Math.sin(elapsed * 2.5 + sphere.userData.phase);
                    sphere.scale.set(scale, scale, scale);
                });
                zeroGroup.children.forEach(child => {
                    if (child.isSprite) {
                        const s = 0.7 + 0.15 * Math.sin(elapsed * 2.0 + child.position.z * 0.5);
                        child.scale.set(s, s, 1);
                    }
                });
            }

            // 粒子地形轻微上下浮动 (通过顶点着色器或直接修改 attribute 会比较耗性能，
            // 这里让整个粒子系统轻微旋转或移动来产生动态感)
            // 让额外粒子缓慢旋转
            extraParticles.rotation.y += 0.0005;

            // 新零点自由落体，落地后加入零点列表
            if (falling) {
                const p = Math.min((elapsed - falling.start) / DROP_TIME, 1);
                falling.sphere.position.y = falling.sprite.position.y = DROP_HEIGHT * (1 - p * p);
                if (p === 1) {
                    const t = falling.t;
                    falling = null;
                    landZero(t);
                }
            }

            // 控制自动旋转
            controls.update();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- 窗口自适应：场景居中放进信息框和底栏之外的空白区，空白区太窄时相机后退 ---
        const BASE_DIST = camera.position.length();
        const infoBox = document.getElementById('info');
        const statusBar = document.getElementById('status');
        let fitDist = BASE_DIST;

        function layout() {
            const W = window.innerWidth, H = window.innerHeight;
            const r = infoBox.getBoundingClientRect(), s = statusBar.getBoundingClientRect();
            const below = { x: 0, y: r.bottom, w: W, h: s.top - r.bottom };
            const right = { x: r.right, y: 0, w: W - r.right, h: s.top };
            const a = below.w * below.h >= right.w * right.h ? below : right;

            renderer.setSize(W, H);
            camera.aspect = W / H;
            camera.setViewOffset(W, H, W / 2 - (a.x + a.w / 2), H / 2 - (a.y + a.h / 2), W, H);

            // 场景投影约 17×9 个单位宽高（含旋转余量）；空白区按至少 40% 屏幕算，避免极端尺寸下相机退太远
            const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const d = Math.max(BASE_DIST,
                8.5 * H / (Math.max(a.w, W * 0.4) * tanHalf),
                4.5 * H / (Math.max(a.h, H * 0.4) * tanHalf));
            // 按比例缩放，保留用户自己的缩放
            camera.position.sub(controls.target).multiplyScalar(d / fitDist).add(controls.target);
            fitDist = d;
            controls.maxDistance = Math.max(40, d * 1.6);
        }

        layout();
        window.addEventListener('resize', layout);

        // --- 互动：加一个零点 ---
        const DROP_HEIGHT = 4, DROP_TIME = reduceMotion ? 0.01 : 0.9;
        const addButton = document.getElementById('addZero');
        const statusText = document.getElementById('statusText');
        let falling = null;

        addButton.addEventListener('click', () => {
            if (falling || !moreZeros.length) return;
            const t = moreZeros.shift();
            falling = { t, start: clock.elapsedTime, ...addZero(t, zeroSpheres.length, DROP_HEIGHT, true) };
            addButton.disabled = true;
        });

        function landZero(t) {
            zeroHeights.push(t);
            document.getElementById('legendAdded').hidden = false;
            refreshTerrain();
            renderStatus();
            layout();
        }

        function refreshTerrain() {
            updateTerrain();
            particleGeometry.attributes.position.needsUpdate = true;
            particleGeometry.attributes.color.needsUpdate = true;
        }

        // --- 互动：放一个假想反例 ---
        const cxToggle = document.getElementById('cxToggle');
        const cxPanel = document.getElementById('cxPanel');
        const cxInput = document.getElementById('cxSigma');
        const cxMat = new THREE.MeshStandardMaterial({
            color: 0xff5577,
            emissive: 0xff2244,
            emissiveIntensity: 2.0,
            roughness: 0.2,
            metalness: 0.1
        });
        const cxGroup = new THREE.Group();
        const cxPoints = [0, 1, 2, 3].map(() => {
            const sphere = new THREE.Mesh(sphereGeom, cxMat);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: zeroGlow,
                color: 0xff5577,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            }));
            sprite.scale.set(0.8, 0.8, 1);
            cxGroup.add(sphere, sprite);
            return { sphere, sprite };
        });
        // 上下各一条细线连起左右镜像，正好被临界线平分
        const cxLine = new THREE.LineSegments(
            new THREE.BufferGeometry().setFromPoints([0, 1, 2, 3].map(() => new THREE.Vector3())),
            new THREE.LineBasicMaterial({ color: 0xff5577, transparent: true, opacity: 0.6 })
        );
        cxGroup.add(cxLine);
        cxGroup.visible = false;
        scene.add(cxGroup);

        function placeCx() {
            const line = cxLine.geometry.attributes.position;
            [[cxS, CX_T], [1 - cxS, CX_T], [cxS, -CX_T], [1 - cxS, -CX_T]].forEach(([s, t], i) => {
                const { sphere, sprite } = cxPoints[i];
                sphere.position.set(sigmaToX(s), 0, tToZ(t));
                sprite.position.copy(sphere.position);
                line.setXYZ(i, sphere.position.x, 0, sphere.position.z);
            });
            line.needsUpdate = true;
            // σ = 0.5 时左右镜像重合，只剩上下一对
            const off = !onLine();
            for (const i of [1, 3]) cxPoints[i].sphere.visible = cxPoints[i].sprite.visible = off;
            cxLine.visible = off;
        }

        function onLine() {
            return Math.abs(cxS - 0.5) < 0.005;
        }

        cxToggle.addEventListener('click', () => {
            cxOn = !cxOn;
            cxGroup.visible = cxOn;
            refreshTerrain();
            renderStatus();
            layout();
        });
        cxInput.addEventListener('input', () => {
            cxS = +cxInput.value;
            placeCx();
            refreshTerrain();
            renderStatus();
        });
        cxS = +cxInput.value;
        placeCx();

        function renderStatus() {
            if (cxOn) {
                statusText.innerHTML = onLine()
                    ? 'σ = 0.50：回到<i>临界线</i>上，只剩 t = ±35 一对共轭零点，不算反例'
                    : `假想反例 σ = ${cxS.toFixed(2)} · 镜像 σ = ${(1 - cxS).toFixed(2)} · t = ±35 上下各一对，共 4 个`;
            } else {
                const up = zeroHeights.filter(t => t > 0).length;
                const down = zeroHeights.length - up;
                if (!moreZeros.length) {
                    statusText.innerHTML = `图里放得下 ${up} 个零点和 ${down} 个共轭镜像 · 已算出的前 10 万亿个零点也全在 <i>临界线</i>&nbsp;上，但还没人证明每一个都在`;
                } else if (down) {
                    statusText.innerHTML = `下半边是共轭镜像 1/2 − i·t，上面每个零点在下面都有一个 · 已放 ${down} 个，同样全在 <i>临界线</i>&nbsp;上`;
                } else {
                    statusText.innerHTML = `拖动旋转，轻点暂停 · 前 ${up} 个零点全部落在 <i>临界线</i>&nbsp;上`;
                }
            }
            addButton.hidden = cxOn || !moreZeros.length;
            addButton.disabled = !!falling;
            cxPanel.hidden = !cxOn;
            cxToggle.textContent = cxOn ? '收起反例' : '放一个反例';
            cxToggle.setAttribute('aria-pressed', cxOn);
            document.body.classList.toggle('cx', cxOn);
        }

        animate();

        // 轻点画面暂停/恢复自动旋转。不用 click：OrbitControls 在 touchstart 里 preventDefault，
        // 手机上收不到 click；鼠标拖动松手又会多发一个 click。按下后挪动超过 5px 的不算轻点
        let downX = 0, downY = 0;
        renderer.domElement.addEventListener('pointerdown', e => {
            if (!e.isPrimary) return;
            downX = e.clientX;
            downY = e.clientY;
        });
        renderer.domElement.addEventListener('pointerup', e => {
            if (e.isPrimary && Math.hypot(e.clientX - downX, e.clientY - downY) < 5) controls.autoRotate = !controls.autoRotate;
        });
    </script>
</body>
</html>
