<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到这一页 · Littlewood</title>
<meta name="robots" content="noindex">
<meta name="description" content="这一页不在 Littlewood 上。返回首页，继续看图解。">
<meta name="theme-color" content="#050510">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=6">

<link rel="stylesheet" href="/site.css?v=3">
<style>
/* 404 = 一篇不存在的图解：和场景页一样的顶栏，题目、一句话、一个回首页的按钮 */
header{max-width:880px;margin:0 auto;padding:56px 16px 8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar .home{display:inline-flex;align-items:center;gap:10px;color:var(--chalk-muted);text-decoration:none;font-weight:700;font-size:1rem;letter-spacing:.08em;transition:color .15s}
.topbar .home svg{width:30px;height:auto;flex:none}
.topbar .home:hover,.topbar .home:focus-visible{color:var(--yellow)}
.topbar .series{color:var(--mint);font-weight:700;letter-spacing:.12em}
h1{font-weight:800;font-size:clamp(1.75rem,5vw,2.7rem);line-height:1.35;margin:30px 0 18px;color:var(--yellow)}
p{max-width:560px;margin:8px 0;color:var(--chalk-muted)}
.cta{display:inline-block;margin-top:22px;border-radius:999px;padding:11px 22px;font-weight:800;text-decoration:none;color:var(--board-deep);background:var(--yellow);transition:transform .15s}
.cta:hover,.cta:focus-visible{transform:translateY(-2px)}
@media (max-width:560px){header{padding-top:34px}}
</style>
</head>
<body>
<header>
    <nav class="topbar" aria-label="站点">
      <a class="home" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="/mark.svg?v=2#mark"/></svg>Littlewood</a>
      <span class="series">404</span>
    </nav>
    <h1>这一页还没画出来</h1>
    <p>地址可能写错了，或者这篇图解还在路上。目录上的每一篇都在。</p>
    <a class="cta" href="/">回到图解目录</a>
</header>
</body>
</html>
